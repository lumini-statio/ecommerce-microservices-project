spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      file-size-threshold: 0
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update

  batch:
    job:
      enabled: false
      name: importCustomersJob
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
      isolation-level-for-create: default

server:
  port: 8091