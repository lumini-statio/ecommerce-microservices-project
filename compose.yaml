services:
  postgres:
    image: postgres:17-alpine
    container_name: pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pg17_data:/var/lib/postgresql/data
    networks:
      - pg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg17_data:

networks:
  pg_net:
    driver: bridge