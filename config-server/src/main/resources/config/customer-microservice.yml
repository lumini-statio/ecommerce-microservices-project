spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  batch:
    job:
      enabled: true
      name: importCustomersJob
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_
      isolation-level-for-create: default

server:
  port: 8091